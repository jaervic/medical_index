<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Segundo cerebro clinico: protocolos, rutas de athenaOne y diccionario medico bilingue."
    />
    <title>Meddex</title>
  </head>
  <body>
    <script>
      // Aplica el tema antes de React para evitar el flash (FOUC).
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('meddex:theme'));
          var theme =
            stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'dark';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* sin localStorage: se queda el tema por defecto */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
